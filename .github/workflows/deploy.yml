name: Deploy to Proxmox
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted # Tells it to run on your LXC 103
    steps:
      - uses: actions/checkout@v3
      - name: Build and Restart Container
        run: |
          # Move to the folder where your actual docker-compose.yml lives
          cd /opt/nextjs-game
          
          # Pull the latest changes from GitHub
          git pull origin main
          
          # Rebuild and restart
          docker compose up -d --build
